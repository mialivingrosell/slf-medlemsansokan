<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bli medlem – Sveriges läkarförbund (prototyp)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Färgversion 1–6 (1 = förvald). ?farg=3 i länken väljer version 3 direkt; valet sparas i webbläsaren.
    // B3E0E5 (gamla 5–6) borttagen 2026-11-04; C2E1E4 flyttade från 7–8 till 5–6 – gamla länkar/val pekas om.
    (function () {
      var FLYTT = { '7': '5', '8': '6' };
      var p = new URLSearchParams(location.search).get('farg');
      var ok = /^[1-6]$/;
      if (FLYTT[p]) p = FLYTT[p];
      try { if (ok.test(p)) localStorage.setItem('slf-farg', p); p = localStorage.getItem('slf-farg'); if (FLYTT[p]) p = FLYTT[p]; } catch (e) {}
      document.documentElement.dataset.farg = ok.test(p) ? p : '1';
    })();
  </script>
</head>
<body>
  <header class="header">
    <a class="logo" href="#valj-spar" aria-label="Sveriges läkarförbund – startsida" id="logo"></a>
    <button class="icon-btn" id="close" aria-label="Stäng (rensar prototypen)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l18 18M21 3L3 21"/></svg>
    </button>
  </header>

  <main id="app"></main>

  <div class="proto-tools" aria-label="Testverktyg för prototypen">
    <button type="button" class="proto-reset" id="reset-all" title="Rensar allt som fyllts i och går till första steget (endast i prototypen)">Nollställ allt</button>
    <button type="button" class="proto-reset" id="reset-step" title="Rensar det som fyllts i på den här sidan (endast i prototypen)">Nollställ steg</button>
    <span id="proto-extra"></span>
  </div>
  <ul class="proto-farg" id="farg-list" aria-label="Färgversioner (endast i prototypen)"></ul>

  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
